services:
  db:
    image: postgres:16-alpine
    container_name: toodle_store_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: toodle
      POSTGRES_PASSWORD: toodle_local
      POSTGRES_DB: toodle_store
    ports:
      - "5433:5432"
    volumes:
      - toodle_store_pg:/var/lib/postgresql/data

volumes:
  toodle_store_pg:
